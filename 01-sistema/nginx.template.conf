# Configuração do nginx usada pelo Nixpacks no Easypanel.
# É a configuração padrão do Nixpacks para PHP, com proteções a mais para este
# sistema (o Nixpacks usa este arquivo sozinho por ele estar na raiz do projeto):
#  - bloqueia arquivos que não podem ser baixados por quem visita o site
#    (SysVeronica.sql, pasta sql/, docs/, README, includes/, fluxo do n8n...);
#  - não deixa rodar PHP dentro de assets/ (onde ficam as fotos enviadas);
#  - aceita uploads de até 20 MB e manda cabeçalhos de segurança.

worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stdout;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;
    server_tokens off;
    client_max_body_size 20m;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        root /app;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

        index index.php;

        charset utf-8;

        # Página de "não encontrado" com a marca, no lugar da tela padrão do nginx.
        error_page 404 /404.html;
        location = /404.html { internal; }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Pastas que só o próprio sistema usa, nunca o navegador.
        location ^~ /sql/      { return 404; }
        location ^~ /docs/     { return 404; }
        location ^~ /includes/ { return 404; }

        # Arquivos de banco, documentação e configuração.
        location ~* \.(sql|md|log|json|ya?ml|lock|sh|bak|conf|ini|dist)$ { return 404; }
        location = /config_credenciais.php { return 404; }
        location = /conecta_bd.php { return 404; }

        # Fotos e logo enviadas ficam em assets/: ali nunca roda PHP.
        location ~* ^/assets/.*\.(php|phtml|phar)$ { return 404; }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
