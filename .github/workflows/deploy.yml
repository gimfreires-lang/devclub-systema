name: Deploy via FTP

# O Clube da Cerveja roda na VPS da Hostinger com Easypanel, que atualiza
# sozinho pelo webhook do GitHub (README, Parte 8). Este envio por FTP é só
# para hospedagem comum, então fica manual: Actions > Deploy via FTP > Run workflow.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: FTP Deploy (envia só o que mudou)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          # Pasta própria do Clube da Cerveja (o brechó continua em /public_html/brechodaveve/).
          server-dir: /public_html/clubedacerveja/
          exclude: |
            **/.git*
            **/.git*/**
            sql/**
            SysVeronica.sql
            docs/**
            .claude/**
            .superpowers/**
